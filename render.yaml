services:
  - type: web
    name: firm-finder
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/leads.db
    disk:
      name: leads-data
      mountPath: /var/data
      sizeGB: 1

